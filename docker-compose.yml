services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "18000:8000"
    volumes:
      - abilgram_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_started
      typesense:
        condition: service_started
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "${VITE_API_URL}"
      VITE_WEBSITE_DOMAIN: "${VITE_WEBSITE_DOMAIN}"
      VITE_WEBSITE_URL: "${VITE_WEBSITE_URL}"
    command: >
      sh -c "npm run build &&
             npm run serve -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - app_network

  db:
    image: postgres:13
    restart: unless-stopped
    env_file: .env
    volumes:
      - abilgramdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  typesense:
    image: typesense/typesense:0.21.0
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: "${TYPESENSE_API_KEY}"
      TYPESENSE_DATA_DIR: "/data"
    volumes:
      - typesensedata:/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  abilgramdata:
  abilgram_media:
  typesensedata:
